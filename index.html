<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3fa8">
<title>Leitor do Vault</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script>try{var d=document.documentElement.dataset,g=function(k,v){var x=localStorage.getItem('vl_'+k);return x?JSON.parse(x):v};var t=g('theme','auto');if(t!=='auto')d.theme=t;d.hsize=g('hsize','g');d.tsize=g('tsize','m');}catch(e){}</script>
</head>
<body>
<header id="bar">
  <div id="title">Leitor do Vault</div>
  <button id="btnMenu" class="ico" title="Menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
  <nav id="menu" hidden>
    <button id="btnHome"><span class="mi">⌂</span>Início</button>
    <button id="btnSearch"><span class="mi">⌕</span>Buscar</button>
    <button id="btnCal"><span class="mi">📅</span>Calendário</button>
    <button id="btnTools"><span class="mi">⋮</span><span id="toolsLabel">Mostrar detalhes da nota</span></button>
    <button id="btnConfig"><span class="mi">⚙</span>Configurações</button>
  </nav>
</header>
<div id="status" hidden></div>
<main id="view"></main>
<script src="config.js"></script>
<script src="marked.min.js"></script>
<script src="js-yaml.min.js"></script>
<script src="bases.js"></script>
<script src="calendario.js"></script>
<script src="app.js"></script>
</body>
</html>
